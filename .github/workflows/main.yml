name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  confirm_config_and_documentation:
    runs-on: ubuntu-latest
    name: Confirm config and documentation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ruby
          bundler-cache: true
      - run: bundle exec rake confirm_config documentation_syntax_check confirm_documentation

  main:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby:
          - "2.7"
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
          - ruby-head
          - jruby-9.4
          - jruby-10.0
          - jruby-10.1
        task:
          - internal_investigation
          - spec
    name: "Ruby ${{ matrix.ruby }}: ${{ matrix.task }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "${{ matrix.ruby }}"
          bundler-cache: true
      - run: NO_COVERAGE=true bundle exec rake ${{ matrix.task }}

  coverage:
    runs-on: ubuntu-latest
    name: "Test coverage"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ruby
          bundler-cache: true
      - run: bundle exec rake spec

  edge-rubocop:
    env:
      BUNDLE_GEMFILE: gemfiles/edge_rubocop.rb
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task:
          - internal_investigation
          - spec
    name: "Edge RuboCop: ${{ matrix.task }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ruby
          bundler-cache: true
      - name: Show RuboCop version
        run: grep '^    rubocop' Gemfile.lock | sort
      - run: NO_COVERAGE=true bundle exec rake ${{ matrix.task }}

  oldest-rubocop:
    env:
      BUNDLE_GEMFILE: gemfiles/oldest_rubocop.rb
    runs-on: ubuntu-latest
    name: "Oldest RuboCop: ${{ matrix.task }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ruby
          bundler-cache: true
      - name: Show RuboCop version
        run: grep '^    rubocop' Gemfile.lock | sort
      - run: NO_COVERAGE=true bundle exec rake spec

  rspec4:
    env:
      BUNDLE_GEMFILE: gemfiles/latest_rspec_4.rb
    runs-on: ubuntu-latest
    name: RSpec 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use latest RSpec 4 from `main` branch
        run: |
          sed -e '/rspec/d' -i Gemfile
          cat << EOF > Gemfile.local
            gem 'rspec', github: 'rspec/rspec', branch: 'main'
            gem 'rspec-core', github: 'rspec/rspec', branch: 'main'
            gem 'rspec-expectations', github: 'rspec/rspec', branch: 'main'
            gem 'rspec-mocks', github: 'rspec/rspec', branch: 'main'
            gem 'rspec-support', github: 'rspec/rspec', branch: 'main'
          EOF
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ruby
          bundler-cache: true
      - run: NO_COVERAGE=true bundle exec rake spec

  prism:
    runs-on: ubuntu-latest
    name: Prism
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          # Specify the minimum Ruby version 2.7 required for Prism to run.
          ruby-version: "2.7"
          bundler-cache: true
      - env:
          NO_COVERAGE: true
          PARSER_ENGINE: parser_prism
        run: bundle exec rake spec
