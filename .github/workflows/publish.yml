name: Publish
on:
  push:
    branches: master
    paths: lib/rubocop/rspec/version.rb
jobs:
  publish:
    name: Publish to RubyGems
    runs-on: ubuntu-latest
    if: github.repository_owner == 'rubocop'
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
          ruby-version: ruby
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
      - name: Create a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle exec rake create_release_notes
          gh release create $(git tag --points-at @) \
            --title "RuboCop RSpec $(git tag --points-at @)" \
            --notes-file relnotes.md
